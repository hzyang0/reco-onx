services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mini_reco
      POSTGRES_USER: mini_reco
      POSTGRES_PASSWORD: mini_reco
    ports:
      - "5432:5432"
    volumes:
      - mini-reco-postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_reco -d mini_reco"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/mini_reco
      DB_USER: mini_reco
      DB_PASSWORD: mini_reco
    ports:
      - "18080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mini-reco-postgres-data:
