services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mini_reco
      MYSQL_USER: mini_reco
      MYSQL_PASSWORD: mini_reco
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    volumes:
      - mini-reco-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umini_reco", "-pmini_reco"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s

  app:
    build:
      context: .
    environment:
      JDBC_URL: jdbc:mysql://db:3306/mini_reco?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&connectTimeout=2000&socketTimeout=1000
      DB_USER: mini_reco
      DB_PASSWORD: mini_reco
      DB_POOL_SIZE: 12
      FLYWAY_LOCATIONS: filesystem:/app/db/migration
      REQUEST_TIMEOUT_MS: 500
      RECALL_FANOUT_PARALLELISM: 3
      RECALL_FANOUT_QUEUE_CAPACITY: 64
      AGENT_MODE: ${AGENT_MODE:-local}
      AGENT_SHORT_MEMORY_TTL_HOURS: ${AGENT_SHORT_MEMORY_TTL_HOURS:-24}
      AGENT_MAX_TOOL_STEPS: ${AGENT_MAX_TOOL_STEPS:-4}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "18081:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mini-reco-mysql-data:
