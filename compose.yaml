name: mini-reco

services:
  app:
    build: .
    image: mini-reco:local
    init: true
    read_only: true
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - java
        - -cp
        - /app/app.jar
        - io.github.hzyang0.minireco.ops.HttpHealthProbe
        - http://localhost:8080/health
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
