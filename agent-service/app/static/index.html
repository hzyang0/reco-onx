<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Reco LangGraph Agent</title><style>body{max-width:980px;margin:40px auto;font:16px system-ui;color:#172033;background:#f5f7fb;padding:0 20px}.card{background:#fff;border-radius:16px;padding:24px;margin:18px 0;box-shadow:0 8px 28px #16223812}input,textarea,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #dce3ee}textarea{width:100%;height:90px}button{background:#2563eb;color:#fff;border:0;cursor:pointer}.tag{display:inline-block;background:#e8efff;color:#2456aa;padding:4px 8px;border-radius:99px;margin:4px;font:12px monospace}pre{white-space:pre-wrap;background:#f5f7fb;padding:12px;border-radius:8px}</style></head><body><h1>Mini Reco LangGraph Agent</h1><p>Agent 主入口：LangGraph 负责状态编排；Java 推荐服务是受限 Tool 后端。</p><div class="card"><label>用户 ID <input id="user" value="456"></label><p><textarea id="message">给我推荐预算 500 以内的数码商品，不要广告</textarea></p><button onclick="send()">运行 Agent</button></div><div class="card"><h2>执行事件</h2><div id="events"></div><h2>最终结果</h2><pre id="result">等待请求</pre></div><script>let ws;function add(x){let e=document.createElement('div');e.className='tag';e.textContent=x;document.querySelector('#events').append(e)}function send(){document.querySelector('#events').replaceChildren();ws=new WebSocket(`ws://${location.host}/ws/chat`);ws.onopen=()=>ws.send(JSON.stringify({user_id:+document.querySelector('#user').value,message:document.querySelector('#message').value,session_id:'console-agent'}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.event==='tool_completed')add(m.data.tool+' · '+m.data.status);if(m.event==='agent_completed')document.querySelector('#result').textContent=JSON.stringify(m.data,null,2)};}</script></body></html>
