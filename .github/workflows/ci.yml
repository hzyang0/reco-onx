name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements.txt
      - run: python -m pip install -r agent-service/requirements.txt
      - name: Constraint, memory and workflow regressions (fixture tools, no LLM)
        working-directory: agent-service
        run: python -m unittest discover -s tests -v
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and package
        env:
          RUN_TESTCONTAINERS: "true"
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Build container image
        run: docker build --tag mini-reco:ci .

  local-life-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mini_reco
          MYSQL_USER: mini_reco
          MYSQL_PASSWORD: mini_reco
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      RUN_LOCAL_LIFE_DB_TESTS: "true"
      JDBC_URL: jdbc:mysql://127.0.0.1:3306/mini_reco?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      RECO_BACKEND_URL: http://127.0.0.1:18082
      REDIS_URL: redis://127.0.0.1:6379/0
      AGENT_PLANNER: local
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-service/requirements.txt
      - run: python -m pip install -r agent-service/requirements.txt
      - run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Migrate fresh database through application startup
        run: |
          java -jar target/mini-reco-access-layer-0.1.0-SNAPSHOT-all.jar 18082 > /tmp/reco.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18082/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/reco.log
          exit 1
      - name: Unit and real MySQL regressions
        working-directory: agent-service
        run: python -m unittest discover -s tests -v
      - name: Start Agent and evaluate real HTTP workflow
        run: |
          (cd agent-service && python -m uvicorn app.main:app --host 127.0.0.1 --port 18081 > /tmp/agent.log 2>&1) &
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/health; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/agent.log; exit 1; fi
          python scripts/evaluate-local-life.py --output output/local-life-evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-life-evaluation
          path: output/local-life-evaluation.json
          if-no-files-found: ignore
